# ============================================
# 甲方服务器 Docker Compose 配置
# 说明: 仅加载预编译的镜像，不进行构建
# 使用: docker compose -f docker-compose.production.yml --env-file .env.production up -d
# ============================================

services:
  # ============ 数据库 ============
  postgres:
    image: postgres:15-alpine
    container_name: aixl-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-aixl}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aixl}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aixl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aixl-network

  # ============ 缓存 ============
  redis:
    image: redis:7-alpine
    container_name: aixl-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aixl-network

  # ============ 后端服务 (只加载镜像，不构建) ============
  backend:
    image: aixl/backend:latest
    container_name: aixl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-aixl}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aixl}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # 授权系统
      LICENSE_SERVER: ${LICENSE_SERVER}
      LICENSE_KEY: ${LICENSE_KEY}
      LICENSE_FORCE_STOP: ${LICENSE_FORCE_STOP:-false}
      # 安全
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # 第三方服务
      PRIVY_APP_ID: ${PRIVY_APP_ID}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PANDASCORE_API_KEY: ${PANDASCORE_API_KEY}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      XMARKET_ADMIN_RPC_URL: ${XMARKET_ADMIN_RPC_URL}
      XMARKET_ADMIN_PRIVATE_KEY: ${XMARKET_ADMIN_PRIVATE_KEY}
      XMARKET_MARKET_FACTORY_ADDRESS: ${XMARKET_MARKET_FACTORY_ADDRESS:-0x45ab369f65c0ef44c1325323f283e6acc92b8bd0}
      XMARKET_COLLATERAL_ADDRESS: ${XMARKET_COLLATERAL_ADDRESS:-0xb90278a476319CbDAd259e4fEAA8E7d9Da05e1EB}
      XMARKET_COLLATERAL_DECIMALS: ${XMARKET_COLLATERAL_DECIMALS:-6}
      XMARKET_DEFAULT_INITIAL_COLLATERAL: ${XMARKET_DEFAULT_INITIAL_COLLATERAL:-1000000}
      XMARKET_DEFAULT_INITIAL_PRICE_YES_BPS: ${XMARKET_DEFAULT_INITIAL_PRICE_YES_BPS:-5000}
      XMARKET_DEFAULT_MIN_TRADE_AMOUNT: ${XMARKET_DEFAULT_MIN_TRADE_AMOUNT:-1}
      XMARKET_DEFAULT_MAX_TRADE_AMOUNT: ${XMARKET_DEFAULT_MAX_TRADE_AMOUNT:-100000}
      XMARKET_DEFAULT_MAX_SLIPPAGE_BPS: ${XMARKET_DEFAULT_MAX_SLIPPAGE_BPS:-500}
      XMARKET_DEFAULT_FEE_BPS: ${XMARKET_DEFAULT_FEE_BPS:-50}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aixl-network

  # ============ Indexer API ============
  indexer-api:
    image: aixl/indexer:latest
    container_name: aixl-indexer-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run api"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-aixl}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aixl}?schema=${INDEXER_DB_SCHEMA:-indexer}
      BSC_TESTNET_RPC_URL: ${INDEXER_RPC_URL}
      INDEXER_CHAIN_ID: ${INDEXER_CHAIN_ID:-97}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-12}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-5000}
      INDEXER_MAX_BLOCKS_PER_RUN: ${INDEXER_MAX_BLOCKS_PER_RUN:-20000}
      INDEXER_API_PORT: 4000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aixl-network

  # ============ Indexer Sync Worker ============
  indexer-sync:
    image: aixl/indexer:latest
    container_name: aixl-indexer-sync
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      indexer-api:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && while true; do npm run sync; sleep ${INDEXER_SYNC_INTERVAL_SECONDS:-15}; done"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-aixl}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aixl}?schema=${INDEXER_DB_SCHEMA:-indexer}
      BSC_TESTNET_RPC_URL: ${INDEXER_RPC_URL}
      INDEXER_CHAIN_ID: ${INDEXER_CHAIN_ID:-97}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-12}
      INDEXER_BATCH_SIZE: ${INDEXER_BATCH_SIZE:-5000}
      INDEXER_MAX_BLOCKS_PER_RUN: ${INDEXER_MAX_BLOCKS_PER_RUN:-20000}
      INDEXER_API_PORT: 4000
    networks:
      - aixl-network

  # ============ 前端服务 (只加载镜像，不构建) ============
  frontend:
    image: aixl/frontend:latest
    container_name: aixl-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://superoctopus.fun/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://superoctopus.fun}
      NEXT_PUBLIC_PRIVY_APP_ID: ${PRIVY_APP_ID}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
      NEXT_PUBLIC_XMARKET_INDEXER_API_BASE_URL: ${NEXT_PUBLIC_XMARKET_INDEXER_API_BASE_URL:-https://superoctopus.fun/indexer}
    networks:
      - aixl-network

  # ============ 管理后台 (只加载镜像，不构建) ============
  admin-web:
    image: aixl/admin:latest
    container_name: aixl-admin
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://superoctopus.fun/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_ADMIN_WS_URL:-wss://superoctopus.fun}
    networks:
      - aixl-network

  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:alpine
    container_name: aixl-nginx
    restart: always
    depends_on:
      - frontend
      - backend
      - admin-web
      - indexer-api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aixl-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aixl-network:
    driver: bridge
