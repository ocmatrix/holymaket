# ============================================
# 甲方服务器 Docker Compose 配置
# 说明: 仅加载预编译的镜像，不进行构建
# 使用: docker compose -f docker-compose.production.yml --env-file .env.production up -d
# ============================================

services:
  # ============ 数据库 ============
  postgres:
    image: postgres:15-alpine
    container_name: aixl-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-aixl}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aixl}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aixl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aixl-network

  # ============ 缓存 ============
  redis:
    image: redis:7-alpine
    container_name: aixl-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aixl-network

  # ============ 后端服务 (只加载镜像，不构建) ============
  backend:
    image: aixl/backend:latest
    container_name: aixl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-aixl}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aixl}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # 授权系统
      LICENSE_SERVER: ${LICENSE_SERVER}
      LICENSE_KEY: ${LICENSE_KEY}
      LICENSE_FORCE_STOP: ${LICENSE_FORCE_STOP:-false}
      # 安全
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.superoctopus.fun}
      # 第三方服务
      PRIVY_APP_ID: ${PRIVY_APP_ID}
      PRIVY_APP_SECRET: ${PRIVY_APP_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PANDASCORE_API_KEY: ${PANDASCORE_API_KEY}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aixl-network

  # ============ 前端服务 (只加载镜像，不构建) ============
  frontend:
    image: aixl/frontend:latest
    container_name: aixl-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://superoctopus.fun/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://superoctopus.fun}
      NEXT_PUBLIC_PRIVY_APP_ID: ${PRIVY_APP_ID}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID}
    networks:
      - aixl-network

  # ============ 管理后台 (只加载镜像，不构建) ============
  admin-web:
    image: aixl/admin:latest
    container_name: aixl-admin
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://superoctopus.fun/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_ADMIN_WS_URL:-wss://superoctopus.fun}
    networks:
      - aixl-network

  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:alpine
    container_name: aixl-nginx
    restart: always
    depends_on:
      - frontend
      - backend
      - admin-web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aixl-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aixl-network:
    driver: bridge
