name: Foundry CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Forge build
        working-directory: contracts
        run: forge build

      - name: Forge test
        working-directory: contracts
        run: forge test --fuzz-runs 200 -vvv
