name: refine-xmarket rotation

# 每 3 小时自动一轮区域轮巡（/refine-xmarket）。
# 聚焦区域由 skill 按时钟从 .claude/skills/refine-xmarket/REGIONS.md 确定性选出
# （blockIndex = floor(epoch/10800) mod N），逐区前进、每日巡满一圈后循环。
#
# 前置 secrets/vars（在仓库 Settings → Secrets and variables → Actions 配置）：
#   secrets.CLAUDE_CODE_OAUTH_TOKEN  或  secrets.ANTHROPIC_API_KEY  —— 二选一，Claude 鉴权
#   secrets.REFINE_RPC_URL（可选）   —— 只读 fork RPC；缺省则合约区降级跳过 fork 门禁
# 注：schedule 仅在工作流文件已存在于默认分支(main)时生效；合入前可用 workflow_dispatch 手动试跑。

on:
  schedule:
    - cron: "0 */3 * * *" # 每 3 小时（UTC 00/03/06/09/12/15/18/21）
  workflow_dispatch:
    inputs:
      region_override:
        description: "强制区域 order 索引(0..N-1)；留空=按时钟选区"
        required: false
        default: ""
      fork_block:
        description: "合约区只读 fork 的 pinnedForkBlock（可选）"
        required: false
        default: ""

# 安全骨架：顶层最小权限；仅本作业按需放开 contents/pull-requests 写以推工作分支与开 PR。
permissions:
  contents: read

# 同一时刻只跑一轮，避免两次触发抢同一工作分支。
concurrency:
  group: refine-xmarket-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # 推送 auto/refine-xmarket/<date> 工作分支
      pull-requests: write # 触上报项时开 PR 候人工 review
    steps:
      - name: Checkout（不持久化凭据）
        uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std / openzeppelin 子模块
          persist-credentials: false
          fetch-depth: 0

      - name: Install Foundry（与 Foundry CI 锁定同版）
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python（slither / semgrep）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-analysis toolchain
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer semgrep

      - name: Install JS deps（root / server / indexer）
        run: |
          npm ci || npm install
          if [ -f server/package.json ]; then (cd server && npm ci || npm install) || true; fi
          if [ -f indexer/package.json ]; then (cd indexer && npm ci || npm install) || true; fi

      - name: Pre-build contracts（暖 cache + 锚 gas snapshot 基线）
        working-directory: contracts
        run: forge build

      - name: Run /refine-xmarket（单区、时钟选区、CI 内只 commit 不 push）
        uses: anthropics/claude-code-action@v1
        env:
          REFINE_RPC_URL: ${{ secrets.REFINE_RPC_URL }}
          REFINE_REGION_OVERRIDE: ${{ github.event.inputs.region_override }}
          REFINE_FORK_BLOCK: ${{ github.event.inputs.fork_block }}
          CI: "true"
        with:
          # 二选一：优先 OAuth token，回退 API key（按你配置的 secret 名保留其一）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/refine-xmarket"
          claude_args: >-
            --max-turns 120

      # skill 在 CI 内按 §P6 仅本地 commit 到 auto/refine-xmarket/<date>；此处统一 push 并开/更新草稿 PR。
      - name: Push 工作分支 + 开/更新草稿 PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          date_utc="$(date -u +%F)"
          branch="auto/refine-xmarket/${date_utc}"
          if ! git rev-parse --verify "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "本轮无工作分支（无可证收益或全区跳过），跳过 push。"
            exit 0
          fi
          ahead="$(git rev-list --count "origin/${{ github.ref_name }}..${branch}" 2>/dev/null || echo 0)"
          if [ "${ahead}" = "0" ]; then
            echo "工作分支无新提交，跳过 push。"; exit 0
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push "${remote}" "${branch}:${branch}"
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            gh pr create --draft --base "${{ github.ref_name }}" --head "${branch}" \
              --title "refine(xmarket): automated region rotation — ${date_utc}" \
              --body "Automated /refine-xmarket region-rotation round. See per-round report in the branch. Draft — human review required for any reported (上报项) contract-ABI / settlement-math / authZ / schema changes." \
              || echo "PR 已存在或开 PR 失败（非阻断）。"
          fi

      # 大轮收尾（§3''/§P7）：仅当本轮是大轮最后一个模块(regionIndex==N-1)且门禁全绿时，
      # 对本大轮的良好状态打一次顺序安全基线 baseline-<K+1>。标签推送被本仓 git 中继策略 403 拒，
      # 故用 GitHub API 建"永不写入的只读基线分支"作为等效不可变回滚锚点。空大轮（无新提交）跳过。
      - name: 大轮完成 → 打安全基线（baseline-<K+1>）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          regions_file=".claude/skills/refine-xmarket/REGIONS.md"
          N="$(grep -cE '^\| [0-9]+ \| ' "${regions_file}" || echo 0)"
          if [ "${N}" -le 0 ]; then echo "无法从 REGIONS.md 确定 N，跳过基线。"; exit 0; fi
          epoch="$(date -u +%s)"
          regionIndex=$(( (epoch / 10800) % N ))
          if [ "${regionIndex}" -ne $(( N - 1 )) ]; then
            echo "本轮 regionIndex=${regionIndex} 非大轮末轮(N-1=$(( N - 1 )))，不打基线。"; exit 0
          fi
          date_utc="$(date -u +%F)"
          branch="auto/refine-xmarket/${date_utc}"
          if ! git rev-parse --verify "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "空大轮：本大轮无工作分支/无改动，跳过基线。"; exit 0
          fi
          goodSha="$(git rev-parse "refs/heads/${branch}")"
          # 现存最大基线序号 K 及其指向 sha（分支或标签）
          maxK=0; latestSha=""
          while read -r sha ref; do
            [ -z "${ref:-}" ] && continue
            k="$(printf '%s' "${ref}" | sed -E 's#.*/baseline-([0-9]+)$#\1#')"
            case "${k}" in ''|*[!0-9]*) continue;; esac
            if [ "${k}" -gt "${maxK}" ]; then maxK="${k}"; latestSha="${sha}"; fi
          done < <(git ls-remote origin 'refs/heads/baseline-*' 'refs/tags/baseline-*' 2>/dev/null || true)
          if [ "${goodSha}" = "${latestSha}" ]; then
            echo "空大轮：HEAD(${goodSha}) 未推进（== baseline-${maxK}），跳过。"; exit 0
          fi
          nextK=$(( maxK + 1 ))
          echo "大轮完成 → 创建 baseline-${nextK} @ ${goodSha}"
          if gh api "repos/${{ github.repository }}/git/refs" \
               -f ref="refs/heads/baseline-${nextK}" -f sha="${goodSha}" >/dev/null 2>&1; then
            echo "baseline-${nextK} 已创建（只读快照分支，指向 ${goodSha}）。"
          else
            echo "创建 baseline-${nextK} 失败（可能已存在或权限不足），非阻断。"
          fi
