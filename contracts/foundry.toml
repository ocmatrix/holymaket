[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
wantos_testnet = "https://rpc.wantos.io"
wantos_mainnet = "https://rpc.wantos.io"

[etherscan]
wantos = { key = "${WANTOS_ETHERSCAN_KEY}", chain = 13555, url = "https://explorer.wantos.io/api" }

[fuzz]
runs = 10000
max_test_rejects = 65536

[profile.intense]
fuzz = { runs = 50000 }

[profile.ci]
fuzz = { runs = 2000 }
